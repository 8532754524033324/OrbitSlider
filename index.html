<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Position Infinite Slider (解説コメント付き)</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./script.js"></script>
</head>


<body>

  <!--
    .track を3つ並べているが、これは
    「前・現在・次」の3セットの入れ物。
    どれがどの役割かはJS側の position プロパティで決まり、
    DOMの並び順そのものには意味がない。
  -->
  <div class="slider">

    <ul class="track"></ul>
    <ul class="track"></ul>
    <ul class="track"></ul>

  </div>


  <div class="controller">

    <button id="prev">
      prev
    </button>

    <button id="next">
      next
    </button>

  </div>
</body>
</html>
