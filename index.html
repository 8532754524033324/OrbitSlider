<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Position Infinite Slider (解説コメント付き)</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./script.js"></script>

</head>


<body>

    <header style="max-width: 500px; margin: 30px auto 0; padding: 0 10px; text-align: center;">
    <h1 style="font-size: 1.2rem; margin-bottom: 8px;">Position Infinite Slider</h1>
    <p style="font-size: 0.85rem; color: #555; line-height: 1.6;">
       3枚のDOM（.track）が持つ相対位置（position: -1 / 0 / 1）だけを
       dom同士でまわしあって無限ループを表現するスライダーのサンプルです。
    </p>
  </header>

  <!--
    .track を3つ並べているが、これは
    「前・現在・次」の3セットの入れ物。
    どれがどの役割かはJS側の position プロパティで決まり、
    DOMの並び順そのものには意味がない。
  -->
  <div class="slider">

    <ul class="track"></ul>
    <ul class="track"></ul>
    <ul class="track"></ul>

  </div>


  <div class="controller">

    <button id="prev">
      prev
    </button>

    <button id="next">
      next
    </button>

  </div>
</body>
</html>
