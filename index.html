<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Position Infinite Slider</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ========================================
       Slider
    ======================================== */

    .slider {
      position: relative;

      width: min(500px, 100%);
      aspect-ratio: 5 / 1;

      margin: 50px auto;

      overflow: hidden;

      border: 1px solid #aaa;
    }


    /* ========================================
       Track
    ======================================== */

    .track {
      position: absolute;
      inset: 0;

      display: flex;

      width: 100%;
      height: 100%;

      will-change: transform;
    }


    /* ========================================
       Item
    ======================================== */

    .track li {
      flex: 0 0 calc(100% / var(--view-count));

      height: 100%;

      padding: 5px;

      list-style: none;

      border: 1px solid #000;
    }


    .track img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* ========================================
       Controller
    ======================================== */

    .controller {
      text-align: center;
    }


    button {
      padding: 8px 20px;

      cursor: pointer;
    }


    button:disabled {
      opacity: 0.5;

      cursor: default;
    }

  </style>
</head>


<body>

  <div class="slider">

    <ul class="track"></ul>
    <ul class="track"></ul>
    <ul class="track"></ul>

  </div>


  <div class="controller">

    <button id="prev">
      prev
    </button>

    <button id="next">
      next
    </button>

  </div>


  <script>

    // ========================================
    // 1. Data
    // ========================================

    const imagePool = [
      "onepiece01_luffy2.png",
      "onepiece02_zoro_bandana.png",
      "onepiece03_nami.png",
      "onepiece04_usopp_sogeking.png",
      "onepiece05_sanji.png",
      "onepiece07_robin.png",
      "onepiece08_franky.png",
      "onepiece09_brook.png",
      "onepiece10_jinbe.png",
      "onepiece11_arlong.png",
      "onepiece12_buggy.png",
      "onepiece13_crocodile.png",
      "onepiece14_enel.png",
      "onepiece15_lucci.png",
      "onepiece16_moria.png",
      "onepiece17_doflamingo.png"
    ];


    // ========================================
    // 2. DOM
    // ========================================

    const slider =
      document.querySelector(".slider");


    const trackElements =
      document.querySelectorAll(".track");


    const prevButton =
      document.getElementById("prev");


    const nextButton =
      document.getElementById("next");


    // ========================================
    // 3. Animation Settings
    // ========================================

    const ANIMATION_DURATION =
      300;


    const ANIMATION_EASING =
      "ease";


    // ========================================
    // 4. Index normalize
    // ========================================

    function normalizeIndex(index) {

      return (
        (index % imagePool.length)
        + imagePool.length
      ) % imagePool.length;

    }


    // ========================================
    // 5. Slide
    //
    // VIEW_COUNT と currentIndex は
    // SLIDEの中だけで管理する。
    // ========================================

    const SLIDE = (() => {

      const VIEW_COUNT =
        5;


      let currentIndex =
        0;


      // ----------------------------------------
      // NEXT
      // ----------------------------------------

      const NEXT = {

        positionStep: -1,


        updateCurrentIndex() {

          currentIndex +=
            VIEW_COUNT;

        }

      };


      // ----------------------------------------
      // PREV
      // ----------------------------------------

      const PREV = {

        positionStep: 1,


        updateCurrentIndex() {

          currentIndex -=
            VIEW_COUNT;

        }

      };


      // ----------------------------------------
      // positionから表示画像を取得
      // ----------------------------------------

      function getItems(position) {

        const startIndex =
          currentIndex
          + position * VIEW_COUNT;


        return Array.from(
          {
            length: VIEW_COUNT
          },

          (_, i) => {

            const index =
              normalizeIndex(
                startIndex + i
              );


            return imagePool[index];

          }
        );

      }


      // ----------------------------------------
      // CSSへ表示枚数を渡す
      // ----------------------------------------

      function setup(slider) {

        slider.style.setProperty(
          "--view-count",
          VIEW_COUNT
        );

      }


      return {
        NEXT,
        PREV,
        getItems,
        setup
      };

    })();


    // ========================================
    // 6. Track
    //
    // Trackが保持する状態は
    //
    //   el
    //   position
    //
    // だけ。
    // ========================================

    class Track {

      constructor(el, position) {

        this.el =
          el;


        /*
          -1 = prev
           0 = current
           1 = next
        */

        this.position =
          position;

      }


      // ----------------------------------------
      // Animation
      // ----------------------------------------

      animate(slide, width) {

        const from =
          this.position;


        const to =
          this.position
          + slide.positionStep;


        const animation =
          this.el.animate(
            [
              {
                transform:
                  `translateX(${from * width}px)`
              },

              {
                transform:
                  `translateX(${to * width}px)`
              }
            ],

            {
              duration:
                ANIMATION_DURATION,

              easing:
                ANIMATION_EASING,

              fill:
                "forwards"
            }
          );


        /*
          to はローカル変数だが、
          commit() がクロージャとして保持する。

          Animation終了後に
          positionを正式に更新する。
        */

        animation.commit = () => {

          const positionUpdated =
            this.updatePosition(
              to
            );


          return positionUpdated
            ? this
            : null;

        };


        return animation;

      }


      // ----------------------------------------
      // Position Update
      //
      // positionを更新する。
      //
      // -1 / 0 / 1 を超えた場合は
      // 反対側の端へ回す。
      //
      // 補正が発生した場合だけ true。
      // ----------------------------------------

      updatePosition(position) {

        this.position =
          position;


        /*
          -1 / 0 / 1 の範囲なら
          そのままでよい。
        */

        if (
          Math.abs(this.position) <= 1
        ) {

          return false;

        }


        /*
          NEXT

          -1
           ↓
          -2
           ↓
           1


          PREV

           1
           ↓
           2
           ↓
          -1


          Math.sign(-2)
          → -1

          -Math.sign(-2)
          → 1


          Math.sign(2)
          → 1

          -Math.sign(2)
          → -1
        */

        this.position =
          -Math.sign(
            this.position
          );


        /*
          positionが反対端へ回ったので、
          このTrackは内容の再描画が必要。
        */

        return true;

      }


      // ----------------------------------------
      // 現在のpositionへ配置
      // ----------------------------------------

      setPosition(width) {

        this.el.style.transform =
          `translateX(${this.position * width}px)`;

      }

    }


    // ========================================
    // 7. Track生成
    // ========================================

    const tracks = [

      new Track(
        trackElements[0],
        -1
      ),

      new Track(
        trackElements[1],
        0
      ),

      new Track(
        trackElements[2],
        1
      )

    ];


    /*
      tracks配列は並べ替えない。


      tracks[0]
      tracks[1]
      tracks[2]


      は最初から最後まで
      同じDOM。


      変化するのは、

      track.position

      だけ。
    */


    // ========================================
    // 8. Track Render
    //
    // currentIndex や VIEW_COUNT は
    // renderTrackでは扱わない。
    //
    // positionだけSLIDEへ渡す。
    // ========================================

    function renderTrack(track) {

      const items =
        SLIDE.getItems(
          track.position
        );


      track.el.innerHTML =
        items
          .map(img => `
            <li>
              <img
                src="./img/${img}"
                alt=""
              >
            </li>
          `)
          .join("");

    }


    // ========================================
    // 9. Track Position
    // ========================================

    function setTrackPositions() {

      const width =
        slider.clientWidth;


      tracks.forEach(track => {

        track.setPosition(
          width
        );

      });

    }


    // ========================================
    // 10. Initial Render
    // ========================================

    SLIDE.setup(
      slider
    );


    tracks.forEach(track => {

      renderTrack(
        track
      );

    });


    setTrackPositions();


    // ========================================
    // 11. Lock
    // ========================================

    let isMoving =
      false;


    function lock() {

      isMoving =
        true;


      prevButton.disabled =
        true;

      nextButton.disabled =
        true;

    }


    function unlock() {

      isMoving =
        false;


      prevButton.disabled =
        false;

      nextButton.disabled =
        false;

    }


    // ========================================
    // 12. Move
    //
    // slideには
    //
    //   SLIDE.NEXT
    //
    // または
    //
    //   SLIDE.PREV
    //
    // が渡される。
    // ========================================

    async function move(slide) {

      if (isMoving) {
        return;
      }


      lock();


      let animations = [];


      try {

        const width =
          slider.clientWidth;


        // --------------------------------------
        // Animation開始
        //
        // まだpositionは変更しない。
        // --------------------------------------

        animations =
          tracks.map(track => {

            return track.animate(
              slide,
              width
            );

          });


        // --------------------------------------
        // 全Animation終了待ち
        // --------------------------------------

        await Promise.all(

          animations.map(
            animation =>
              animation.finished
          )

        );


        // --------------------------------------
        // currentIndex更新
        // --------------------------------------

        slide.updateCurrentIndex();


        // --------------------------------------
        // Position Update
        //
        // animate()時に登録した
        // commit()をここで遅延実行。
        //
        // positionが反対端へ回ったTrackだけ
        // Track自身が返る。
        // --------------------------------------

        animations.forEach(animation => {

          const updatedTrack =
            animation.commit();


          if (updatedTrack) {

            renderTrack(
              updatedTrack
            );

          }

        });


        // --------------------------------------
        // 新しいpositionへ正式配置
        // --------------------------------------

        setTrackPositions();


        // --------------------------------------
        // Animation解除
        // --------------------------------------

        animations.forEach(animation => {

          animation.cancel();

        });

      }


      catch (error) {

        /*
          commit()実行前であれば
          track.positionは変更されていない。

          元のpositionへ戻す。
        */

        setTrackPositions();


        animations.forEach(animation => {

          animation.cancel();

        });

      }


      finally {

        unlock();

      }

    }


    // ========================================
    // 13. Controller
    // ========================================

    nextButton.addEventListener(
      "click",
      () => {

        move(
          SLIDE.NEXT
        );

      }
    );


    prevButton.addEventListener(
      "click",
      () => {

        move(
          SLIDE.PREV
        );

      }
    );


    // ========================================
    // 14. Resize
    // ========================================

    window.addEventListener(
      "resize",
      () => {

        if (isMoving) {
          return;
        }


        setTrackPositions();

      }
    );

  </script>

</body>

</html>
